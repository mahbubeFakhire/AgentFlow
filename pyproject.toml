[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentflow"
version = "0.1.0"
description = "Multi-tenant durable AI agent platform"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg",
    "alembic>=1.13,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentflow*"]
namespaces = false